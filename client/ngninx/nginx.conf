# Full Nginx config for serving Next.js static export (out directory)
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    # Update the path below to the actual location of mime.types in your nginx install
    include       C:/dev/nginx-1.28.0/conf/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name localhost; # Change to your domain or use _ for all
        root C:/dev/antoncmorgan-website/client/out; # Path to your 'out' folder (use forward slashes on Windows)

        # Serve static files
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Serve Next.js static assets
        location /_next/ {
            alias C:/dev/antoncmorgan-website/client/out/_next/; # Path to your out/_next directory (forward slashes)
            access_log off;
            expires 1y;
            add_header Cache-Control "public";
        }

        # Serve favicon and robots.txt
        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }
    }
}
