name: Deploy to AWS

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Backup and deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            strapi/package-lock.json
      - name: Verify frontend
        working-directory: client
        run: |
          npm ci
          npm run test --if-present
          npm run test:system --if-present
          npm run build
      - name: Verify backend
        working-directory: strapi
        run: |
          npm ci
          npm run test --if-present
          npm run test:system --if-present
          npm run build
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Back up the Strapi database
        env:
          DB_INSTANCE_IDENTIFIER: ${{ vars.AWS_RDS_INSTANCE_IDENTIFIER }}
        run: |
          snapshot_id="strapi-predeploy-${GITHUB_SHA:0:12}-$(date -u +%Y%m%d%H%M%S)"
          aws rds create-db-snapshot \
            --db-instance-identifier "$DB_INSTANCE_IDENTIFIER" \
            --db-snapshot-identifier "$snapshot_id"
          aws rds wait db-snapshot-available --db-snapshot-identifier "$snapshot_id"
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login
      - name: Build and publish Strapi image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }}
        run: |
          image="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker build --platform linux/amd64 \
            --tag "$image:$GITHUB_SHA" \
            --tag "$image:latest" \
            strapi
          docker push "$image:$GITHUB_SHA"
          docker push "$image:latest"
      - name: Deploy Strapi to ECS Express Mode
        env:
          SERVICE_ARN: ${{ vars.AWS_ECS_SERVICE_ARN }}
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }}
        run: |
          aws ecs update-express-gateway-service \
            --service-arn "$SERVICE_ARN" \
            --primary-container "image=$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA,containerPort=1337" \
            --monitor-resources DEPLOYMENT \
            --monitor-mode TEXT-ONLY
      - name: Deploy frontend to Amplify
        env:
          AMPLIFY_APP_ID: ${{ vars.AWS_AMPLIFY_APP_ID }}
        run: |
          job_id="$(aws amplify start-job --app-id "$AMPLIFY_APP_ID" --branch-name main --job-type RELEASE --query 'jobSummary.jobId' --output text)"
          for _ in {1..30}; do
            status="$(aws amplify get-job --app-id "$AMPLIFY_APP_ID" --branch-name main --job-id "$job_id" --query 'job.summary.status' --output text)"
            case "$status" in
              SUCCEED) exit 0 ;;
              FAILED|CANCELLED) echo "Amplify deployment $status" >&2; exit 1 ;;
            esac
            sleep 20
          done
          echo "Timed out waiting for Amplify deployment" >&2
          exit 1

  release:
    name: Create release
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx semantic-release
